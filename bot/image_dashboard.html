<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle Image Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:20px;border-bottom:1px solid #333;text-align:center}
.header h1{font-size:1.5rem;color:#00d4ff}
.header p{color:#888;font-size:0.85rem;margin-top:4px}
.container{max-width:800px;margin:0 auto;padding:20px}
.card{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{color:#00d4ff;font-size:1.1rem;margin-bottom:12px}
label{display:block;color:#aaa;font-size:0.85rem;margin-bottom:4px}
select,input,textarea{width:100%;padding:10px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:#e0e0e0;font-size:0.95rem;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
button{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;border:none;padding:12px 24px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:opacity 0.2s}
button:hover{opacity:0.9}
button:disabled{opacity:0.4;cursor:not-allowed}
.status{text-align:center;padding:12px;color:#aaa;font-size:0.9rem}
.status.running{color:#ffaa00}
.status.done{color:#00ff88}
.status.error{color:#ff4444}
.progress-bar{width:100%;height:4px;background:#1a1a2e;border-radius:2px;margin:8px 0;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);width:0%;transition:width 0.3s}
.result{text-align:center;margin-top:16px}
.result img{max-width:100%;border-radius:8px;border:1px solid #333}
.comfyui-status{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.dot.on{background:#00ff88}
.dot.loading{background:#ffaa00;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{flex:1;padding:8px;font-size:0.8rem;background:#1a1a2e;border:1px solid #333;color:#aaa}
.actions button:hover{border-color:#00d4ff;color:#00d4ff}
.history{margin-top:16px}
.history-item{display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid #1a1a2e}
.history-item img{width:48px;height:48px;object-fit:cover;border-radius:4px}
.history-item .info{flex:1;font-size:0.85rem;color:#aaa}
.history-item .info .prompt{color:#e0e0e0}
</style>
</head>
<body>
<div class="header">
  <h1>🔮 Oracle Image Generator</h1>
  <p>FLUX.2 Klein 4B · CPU · Auto-shutdown after 5 min idle</p>
  <a href="/gallery" style="color:#00d4ff;font-size:0.85rem;margin-top:4px;display:inline-block">🖼️ View All Generated Images →</a>
</div>
<div class="container">
  <div class="card">
    <div class="comfyui-status">
      <div class="dot" id="comfyui-dot"></div>
      <span id="comfyui-label">Checking...</span>
      <div class="actions">
        <button onclick="startComfyui()" id="btn-start">Start</button>
        <button onclick="stopComfyui()" id="btn-stop">Stop</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Generate Image</h2>
    <label>Workflow</label>
    <select id="workflow-select" onchange="onWorkflowChange()"></select>
    <p id="workflow-desc" style="color:#666;font-size:0.8rem;margin:-8px 0 12px"></p>
    <label>Prompt</label>
    <textarea id="prompt-input" placeholder="a beautiful sunset over mountains, photorealistic, 4k"></textarea>
    <button onclick="generate()" id="btn-generate">✨ Generate</button>
    <div class="status" id="status"></div>
    <div class="progress-bar" id="progress-bar" style="display:none"><div class="fill" id="progress-fill"></div></div>
    <div class="result" id="result"></div>
  </div>

  <div class="card history" id="history-card" style="display:none">
    <h2>Recent Generations</h2>
    <div id="history-list"></div>
  </div>
</div>

<script>
const API = '';  // same origin
let workflows = {};
let history = [];
let polling = null;

// ── Init ──────────────────────────────────────
async function init() {
  await checkComfyui();
  await loadWorkflows();
  setInterval(checkComfyui, 15000);
}

async function checkComfyui() {
  try {
    const r = await fetch(`${API}/api/comfyui`);
    const d = await r.json();
    const dot = document.getElementById('comfyui-dot');
    const label = document.getElementById('comfyui-label');
    if (d.running) {
      dot.className = 'dot on';
      const ram = d.stats ? (d.stats.ram_total / 1073741824).toFixed(1) : '?';
      const free = d.stats ? (d.stats.ram_free / 1073741824).toFixed(1) : '?';
      label.textContent = `ComfyUI running · ${ram} GB RAM · ${free} GB free`;
    } else {
      dot.className = 'dot';
      label.textContent = 'ComfyUI stopped — click Start';
    }
  } catch(e) {
    document.getElementById('comfyui-dot').className = 'dot';
    document.getElementById('comfyui-label').textContent = 'Server unreachable';
  }
}

async function loadWorkflows() {
  try {
    const r = await fetch(`${API}/api/workflows`);
    workflows = await r.json();
    const sel = document.getElementById('workflow-select');
    sel.innerHTML = '';
    for (const [k, v] of Object.entries(workflows)) {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = v.name;
      sel.appendChild(opt);
    }
    onWorkflowChange();
  } catch(e) {
    document.getElementById('workflow-select').innerHTML = '<option>No workflows found</option>';
  }
}

function onWorkflowChange() {
  const sel = document.getElementById('workflow-select').value;
  const wf = workflows[sel];
  document.getElementById('workflow-desc').textContent = wf ? wf.description : '';
}

async function startComfyui() {
  document.getElementById('btn-start').disabled = true;
  document.getElementById('comfyui-dot').className = 'dot loading';
  document.getElementById('comfyui-label').textContent = 'Starting ComfyUI...';
  try {
    await fetch(`${API}/api/comfyui/start`, {method: 'POST'});
    // Poll until ready
    for (let i = 0; i < 60; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const r = await fetch(`${API}/api/comfyui`);
      const d = await r.json();
      if (d.running) { checkComfyui(); break; }
    }
  } catch(e) {}
  document.getElementById('btn-start').disabled = false;
}

async function stopComfyui() {
  await fetch(`${API}/api/comfyui/stop`, {method: 'POST'});
  checkComfyui();
}

async function generate() {
  const prompt = document.getElementById('prompt-input').value.trim();
  const workflow = document.getElementById('workflow-select').value;
  if (!prompt) { setStatus('Enter a prompt', ''); return; }

  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  document.getElementById('result').innerHTML = '';
  showProgress(true);
  setStatus('Submitting...', 'running');

  try {
    const r = await fetch(`${API}/api/generate`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({workflow, prompt})
    });
    const d = await r.json();
    if (d.error) { setStatus(d.error, 'error'); btn.disabled = false; return; }
    
    setStatus(`Job submitted (${d.prompt_id.slice(0,8)}...) · CPU generation takes 2-5 min`, 'running');
    pollJob(d.prompt_id, prompt);
  } catch(e) {
    setStatus('Network error: ' + e.message, 'error');
    btn.disabled = false;
  }
}

async function pollJob(promptId, promptText) {
  const start = Date.now();
  const updateProgress = () => {
    const elapsed = (Date.now() - start) / 1000;
    const pct = Math.min(95, (elapsed / 300) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
  };
  const iv = setInterval(updateProgress, 1000);

  while (true) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const r = await fetch(`${API}/api/status/${promptId}`);
      const d = await r.json();
      
      if (d.status === 'done') {
        clearInterval(iv);
        document.getElementById('progress-fill').style.width = '100%';
        setStatus(`Done in ${d.elapsed}s`, 'done');
        document.getElementById('result').innerHTML = `<img src="${d.image_url}" alt="Generated image" loading="eager">`;
        showProgress(false);
        document.getElementById('btn-generate').disabled = false;
        addHistory(promptText, d.image_url);
        return;
      }
      if (d.status === 'error' || d.status === 'timeout') {
        clearInterval(iv);
        setStatus(d.status === 'timeout' ? 'Timed out (5 min)' : 'Generation failed', 'error');
        showProgress(false);
        document.getElementById('btn-generate').disabled = false;
        return;
      }
      setStatus(`Generating... ${d.elapsed}s elapsed`, 'running');
    } catch(e) {}
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
}

function showProgress(show) {
  document.getElementById('progress-bar').style.display = show ? 'block' : 'none';
  if (show) document.getElementById('progress-fill').style.width = '0%';
}

function addHistory(prompt, url) {
  history.unshift({prompt, url, time: new Date().toLocaleTimeString()});
  if (history.length > 10) history.pop();
  const card = document.getElementById('history-card');
  const list = document.getElementById('history-list');
  card.style.display = 'block';
  list.innerHTML = history.map(h => `
    <div class="history-item">
      <img src="${h.url}" alt="">
      <div class="info">
        <div class="prompt">${h.prompt.slice(0,80)}</div>
        <div>${h.time}</div>
      </div>
    </div>
  `).join('');
}

init();
</script>
</body>
</html>

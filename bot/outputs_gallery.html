<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle — Generated Images</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:20px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:1.4rem;color:#00d4ff}
.header a{color:#00d4ff;text-decoration:none;font-size:0.85rem}
.header a:hover{text-decoration:underline}
.container{max-width:1200px;margin:0 auto;padding:20px}
.stats{color:#666;font-size:0.85rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#12121a;border:1px solid #2a2a3a;border-radius:12px;overflow:hidden;transition:border-color 0.2s}
.card:hover{border-color:#00d4ff}
.card img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;display:block}
.card .meta{padding:12px}
.card .prompt{color:#aaa;font-size:0.8rem;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .info{display:flex;justify-content:space-between;align-items:center;color:#555;font-size:0.75rem}
.card .dl{color:#00d4ff;text-decoration:none;font-size:0.8rem}
.card .dl:hover{text-decoration:underline}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;justify-content:center;align-items:center;cursor:pointer}
.modal.show{display:flex}
.modal img{max-width:95%;max-height:95%;border-radius:8px}
.modal .close{position:absolute;top:16px;right:20px;color:#fff;font-size:2rem;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:#555}
.empty h2{color:#333;margin-bottom:8px}
.empty a{color:#00d4ff}
.refresh{background:#1a1a2e;border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem}
.refresh:hover{border-color:#00d4ff;color:#00d4ff}
</style>
</head>
<body>
<div class="header">
  <h1>🖼️ Generated Images</h1>
  <div>
    <button class="refresh" onclick="load()">↻ Refresh</button>
    <a href="/" style="margin-left:12px">← Generator</a>
  </div>
</div>
<div class="container">
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <h2>No images yet</h2>
    <p>Generate your first image at the <a href="/">Image Generator</a></p>
  </div>
</div>
<div class="modal" id="modal" onclick="this.classList.remove('show')">
  <span class="close">×</span>
  <img id="modal-img" src="">
</div>
<script>
async function load() {
  try {
    const r = await fetch('/api/outputs');
    const data = await r.json();
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const stats = document.getElementById('stats');
    
    if (data.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      stats.textContent = '';
      return;
    }
    
    empty.style.display = 'none';
    const totalKB = data.reduce((s, f) => s + f.size_kb, 0);
    stats.textContent = `${data.length} image${data.length>1?'s':''} · ${(totalKB/1024).toFixed(1)} MB total`;
    
    grid.innerHTML = data.map(f => {
      const date = new Date(f.created * 1000);
      const time = date.toLocaleString();
      return `
        <div class="card">
          <img src="${f.url}" alt="${f.prompt || 'Generated image'}" 
               onclick="document.getElementById('modal-img').src=this.src;document.getElementById('modal').classList.add('show')" loading="lazy">
          <div class="meta">
            <div class="prompt">${f.prompt || 'No prompt recorded'}</div>
            <div class="info">
              <span>${time} · ${f.size_kb} KB</span>
              <a class="dl" href="${f.url}" download="${f.filename}">↓ Download</a>
            </div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="empty"><h2>Could not load images</h2><p>Is the image server running?</p></div>';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>

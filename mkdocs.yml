site_name: oracle_Vault
site_description: Grant's knowledge vault and project dashboard
site_url: https://grentchello.github.io/Oracle_Pages/
repo_url: https://github.com/Grentchello/oracle_Vault
repo_name: Grentchello/oracle_Vault
edit_uri: edit/main/

# Phone-friendly theme config
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Extra CSS for phone polish
extra_css:
  - assets/extra.css

# Markdown extensions — wikilinks, task lists, etc.
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.keys
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark

# Plugins
plugins:
  - search

# Nav — manually curated for predictable phone layout
nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - projects/_template/index.md
      - Memecoin Trading Bot: projects/memecoin-trading/index.md
      - Trading Pairs Bot: projects/trading-pairs/index.md
  - Trading:
      - trading/index.html
      - trading-pairs/pairs-dashboard.html
  - Tasks:
      - tasks/index.md
  - Daily Journal:
      - daily/index.md
      - 2026-08-25: daily/2026-08-25.md
  - Wiki:
      - SCHEMA: SCHEMA.md
      - ORIENTATION: ORIENTATION.md
  - Research:
      - CoinCLIP (memecoins): research/coinclip.md
      - ME2F fragility: research/memecoin-fragility.md
      - Entities: entities/index.md
      - Concepts: concepts/index.md
      - Comparisons: comparisons/index.md
      - Queries: queries/index.md
  - Meta:
      - Method: _meta/method.md
      - Wallpapers: _meta/wallpapers.md
      - Daily Journal Format: _meta/daily-journal.md

# Exclude from build
docs_dir: wiki
exclude_docs: |
  wiki/.git/
  wiki/.github/
  wiki/log.md
  wiki/assets/

# Build settings
strict: false
site_dir: site
use_directory_urls: true
